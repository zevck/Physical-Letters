; Physical Letters - Italian locale (UTF-8). Used for the game's language (sLanguage), or the one
; set in PhysicalLetters.ini ([General] Language). A key left out is English.

[Letters]
; The player's letter's first line, before the recipient's name. A space follows it, unless it ends in a full-width colon.
To = A:
; A letter's item name when the name of who it's to (or from) isn't known.
Letter = Lettera
; A letter's item name: the player's letters and letters between NPCs. {Name}: the recipient.
LetterTo = Lettera per {Name}
; A letter's item name: letters to the player. {Name}: the author.
LetterFrom = Lettera da {Name}
; A letter's item card, under its model in the inventory.
Card = Una lettera per {Recipient} da {Author}.
; Added to a returned letter's item card.
ReturnDeceased = Ritorno al mittente (decesso)
ReturnNotFound = Ritorno al mittente (irreperibile)
; The page of a letter whose text was lost.
Unreadable = L'inchiostro è colato; la lettera è illeggibile.
; The blank letter's item name.
Parchment = Pergamena
