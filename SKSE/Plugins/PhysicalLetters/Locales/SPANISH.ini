; Physical Letters - Spanish locale (UTF-8). Used for the game's language (sLanguage), or the one
; set in PhysicalLetters.ini ([General] Language). A key left out is English.

[Letters]
; The player's letter's second line, below "From:", before the recipient's name. A space follows it, unless it ends in a full-width colon.
To = Para:
; The player's letter's first line, before its sender's name. A space follows it, unless it ends in a full-width colon.
From = De:
; A letter's item name when the name of who it's to (or from) isn't known.
Letter = Carta
; A letter's item name: the player's letters and letters between NPCs. {Name}: the recipient.
LetterTo = Carta para {Name}
; A letter's item name: letters to the player. {Name}: the author.
LetterFrom = Carta de {Name}
; A letter's item card, under its model in the inventory.
Card = Una carta para {Recipient} de {Author}.
; An anonymous letter's item card (the player left "From:" empty): the card without its author.
CardTo = Una carta para {Recipient}.
; Added to the item card of a letter sent with a package.
CardPackage = Con un paquete.
; Under the text of a letter sent with a package: what it holds ({Items}: "50 Gold, Steel Sword").
Enclosed = Adjunto: {Items}
; The chest the player packs a package in: the container menu's title.
PackingChest = Paquete
; Added to a returned letter's item card.
ReturnDeceased = Devolución al remitente (por fallecimiento)
ReturnNotFound = Devolución al remitente (paradero desconocido)
; The page of a letter whose text was lost.
Unreadable = La tinta se ha corrido; la carta no se puede leer.
; The blank letter's item name.
Parchment = Pergamino
; The DM Letter's item name: the dungeon master's tool for sending a letter from one NPC to another.
DmLetter = Carta del máster
; The DM Letter's item card, under its model in the inventory.
DmLetterCard = Envía una carta de quien sea a quien sea.
; The DM Letter's third line, before the hours until delivery (0: now). A space follows it, unless it ends in a full-width colon.
DmDelivery = Entrega (horas):
; The DM Letter's package box line, before [ ]: ticked, saving opens a chest to pack what goes with the letter.
DmPackage = Paquete
; The DM Letter's check box line, before [ ]: ticked, the writer puts the text in their own words; not ticked, it's sent as written.
DmTransform = Transformar
; The DM Letter's second box, on the Transform line: ticked, the letter is a perfect forgery in the writer's name.
DmForgery = Falsificación
